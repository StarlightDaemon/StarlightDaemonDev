<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#000000">
    <title>Page Not Found | StarlightDaemon</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css?v=1.0.9">
    <link rel="stylesheet" href="/css/fonts.css" integrity="sha384-7BkNWl/WwSQmth8QBye9DsmbwIkMteW4c7dqTpump3evDwKg1SXXPn9NiggFfhxY" crossorigin="anonymous">
</head>

<body data-theme="p1-matrix">
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <header class="site-header error-header">
        <a class="logo" href="/" aria-label="Return to the StarlightDaemon homepage">
            <picture>
                <source srcset="/assets/thinker-logo.webp" type="image/webp">
                <img src="/assets/thinker-logo.png" alt="" width="80" height="80">
            </picture>
        </a>
        <div class="header-center">
            <p class="header-title"><a class="brand-home" href="/">StarlightDaemon</a></p>
            <p class="header-tagline">Developer &amp; Open Source Enthusiast</p>
        </div>
    </header>

    <main id="main-content" class="error-page" tabindex="-1">
        <section class="error-card" aria-labelledby="error-title">
            <p class="error-code" aria-hidden="true">404</p>
            <h1 id="error-title">Page not found</h1>
            <p>The address may be outdated or mistyped. Return home to explore the current projects and libraries.</p>
            <div class="recovery-links">
                <a class="primary-link" href="/">Return home</a>
                <a class="secondary-link" href="https://github.com/StarlightDaemon" rel="noopener noreferrer">Visit GitHub profile</a>
            </div>
        </section>
    </main>
</body>

</html>
